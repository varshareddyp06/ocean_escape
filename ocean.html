<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ocean Odyssey</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:#001f3f;
}

canvas{
display:block;
}

#menu{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(#00bfff,#0077be,#001f3f);
color:white;
text-align:center;
}

#menu h1{
font-size:70px;
text-shadow:0 0 20px cyan;
}

#menu button{
padding:15px 40px;
font-size:24px;
border:none;
border-radius:15px;
cursor:pointer;
background:gold;
}

#hud{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:24px;
display:none;
}

#countdown{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:120px;
color:white;
display:none;
font-weight:bold;
text-shadow:0 0 30px cyan;
}

</style>
</head>

<body>

<div id="menu">

<h1>🌊 OCEAN ODYSSEY</h1>

<p>🐢 Collect Starfish</p>
<p>🦈 Avoid Sharks</p>
<p>⏱ Survive 60 Seconds</p>

<p>
⬆ Up &nbsp;
⬇ Down &nbsp;
⬅ Left &nbsp;
➡ Right
</p>

<button onclick="begin()">START</button>

</div>

<div id="countdown"></div>

<div id="hud">
Score: <span id="score">0</span>
|
Time: <span id="time">60</span>
|
High: <span id="high">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let score=0;
let timeLeft=60;
let running=false;

let high=localStorage.getItem("oceanHigh")||0;
document.getElementById("high").innerText=high;

const turtle={
x:100,
y:100,
speed:6
};

const keys={};

document.addEventListener("keydown",e=>{
keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
keys[e.key]=false;
});

let treasure={
x:400,
y:300
};

let sharks=[];

function spawnShark(){

sharks.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
speed:1.5+Math.random()

});

}

spawnShark();
spawnShark();

function begin(){

document.getElementById("menu").style.display="none";

let cd=document.getElementById("countdown");

cd.style.display="block";

let n=3;

cd.innerText=n;

let t=setInterval(()=>{

n--;

if(n>0){

cd.innerText=n;

}else if(n===0){

cd.innerText="GO!";

}else{

clearInterval(t);

cd.style.display="none";

startGame();

}

},1000);

}

function startGame(){

running=true;

document.getElementById("hud").style.display="block";

setInterval(()=>{

if(!running) return;

timeLeft--;

document.getElementById("time").innerText=timeLeft;

if(timeLeft%15===0){

spawnShark();

}

if(timeLeft<=0){

endGame("MISSION COMPLETE");

}

},1000);

}

function endGame(msg){

running=false;

if(score>high){

localStorage.setItem("oceanHigh",score);

}

alert(msg+"\nScore: "+score);

location.reload();

}

function update(){

if(!running) return;

if(keys["ArrowUp"]) turtle.y-=turtle.speed;
if(keys["ArrowDown"]) turtle.y+=turtle.speed;
if(keys["ArrowLeft"]) turtle.x-=turtle.speed;
if(keys["ArrowRight"]) turtle.x+=turtle.speed;

let dx=turtle.x-treasure.x;
let dy=turtle.y-treasure.y;

if(Math.sqrt(dx*dx+dy*dy)<40){

score++;

document.getElementById("score").innerText=score;

treasure.x=Math.random()*canvas.width;
treasure.y=Math.random()*canvas.height;

}

for(let s of sharks){

let dx=turtle.x-s.x;
let dy=turtle.y-s.y;

let d=Math.sqrt(dx*dx+dy*dy);

s.x+=dx/d*s.speed;
s.y+=dy/d*s.speed;

if(d<35){

endGame("🦈 SHARK ATTACK");

}

}

}

function background(){

let g=ctx.createLinearGradient(
0,0,0,canvas.height
);

g.addColorStop(0,"#00bfff");
g.addColorStop(1,"#001f3f");

ctx.fillStyle=g;
ctx.fillRect(
0,0,
canvas.width,
canvas.height
);

for(let i=0;i<80;i++){

ctx.beginPath();

ctx.arc(

(i*37+Date.now()/40)%canvas.width,

(i*21)%canvas.height,

3,

0,

Math.PI*2

);

ctx.fillStyle=
"rgba(255,255,255,.25)";

ctx.fill();

}

}

function draw(){

background();

ctx.font="70px serif";
ctx.fillText(
"🐢",
turtle.x,
turtle.y
);

ctx.font="55px serif";
ctx.fillText(
"⭐",
treasure.x,
treasure.y
);

ctx.font="75px serif";

for(let s of sharks){

ctx.fillText(
"🦈",
s.x,
s.y
);

}

}

function loop(){

update();
draw();

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
